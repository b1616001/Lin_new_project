[versions]
agp = "8.13.2"
safeargs = "2.4.2"

kotlin_version = '1.8.21'
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.12.4"
constraintlayout = "2.2.1"
gson = "2.8.9"
recyclerview = "1.4.0"

#toasty = "1.5.0"
#retrofit = "2.8.9"
#adapter-rxjava2 = "2.5.0"
#converter-gson = "2.9.0"
#converter-scalars = "2.9.0"



[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }

#toasty = { group = "com.github.GrenderG:Toasty", name = "Toasty", version.ref = "toasty" }
#retrofit = { group = "com.squareup.retrofit2:retrofit", name = "retrofit", version.ref = "retrofit" }
#adapter-rxjava2 = { group = "com.squareup.retrofit2:adapter-rxjava2", name = "adapter-rxjava2", version.ref = "adapter-rxjava2" }
#converter-gson = { group = "com.squareup.retrofit2:converter-gson", name = "converter-gson", version.ref = "converter-gson" }
#converter-scalars = { group = "com.squareup.retrofit2:converter-scalars", name = "converter-scalars", version.ref = "converter-scalars" }




[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
safeargs = { id = "androidx.navigation.safeargs", version.ref = "safeargs" }

kotlin-gradle-plugin = { id = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin_version" }

#classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
